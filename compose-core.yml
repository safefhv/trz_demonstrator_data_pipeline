services:
  redis:
    container_name: redis
    image: redis:7
    ports:
      - "6379:6379"
  insight:
    container_name: redis-insight
    image: redis/redisinsight:latest
    restart: always
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    depends_on:
      - redis
    ports:
      - 5540:5540

  mqtt-broker:
    container_name: mqtt-broker
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    configs:
      - source: mosquitto_conf
        target: /mosquitto/config/mosquitto.conf

  redpanda-0:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    container_name: redpanda-0
    volumes:
      - demonstrator_redpanda:/var/lib/redpanda/data
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
  redpanda-console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - 8080:8080
    depends_on:
      - redpanda-0

  timescaledb:
    container_name: timescaledb
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_PASSWORD: demonstrator
      POSTGRES_USER: demonstrator
    ports:
      - 5432:5432
    volumes:
      - demonstrator_timescaledb:/var/lib/postgresql/data
  
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80
    volumes:
      - demonstrator_pgadmin:/var/lib/pgadmin

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - 3000:3000
    volumes:
      - demonstrator_grafana:/var/lib/grafana
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    depends_on:
      - timescaledb

networks:
  default:
    name: demonstrator
    external: true

volumes:
  demonstrator_redpanda: null
  demonstrator_timescaledb: null
  demonstrator_grafana: null
  demonstrator_pgadmin: null


configs:
  mosquitto_conf:
    content: |
      listener 1883
      allow_anonymous true

      persistence true
      persistence_location /mosquitto/data/

      log_type all

  grafana_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: TimescaleDB
          type: postgres
          url: timescaledb:5432
          user: demonstrator
          secureJsonData:
            password: demonstrator
          jsonData:
            database: postgres
            sslmode: disable
            timescaledb: true
          isDefault: true
